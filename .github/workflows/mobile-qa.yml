name: Montescano mobile responsive QA
on:
  push:
    branches: [main, benchmark-auditoria-2026]
    paths:
      - 'scripts/mobile-qa.mjs'
      - '.github/workflows/mobile-qa.yml'
      - 'components/**'
      - 'app/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      MOBILE_QA_URL: 'https://montescano-catalogo-comercial.vercel.app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test mobile responsive behavior
        run: node scripts/mobile-qa.mjs
      - name: Save screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montescano-mobile-qa
          path: mobile-qa-artifacts/
          retention-days: 5
          if-no-files-found: warn
